site_name: CoE5SE
repo_url: https://github.com/musical-pianist/coe5se-docs
edit_uri: edit/main/docs/
docs_dir: docs
theme:
  name: material
  custom_dir: overrides
  logo: assets/banner.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - content.tooltips
    - content.action.edit
    - content.code.copy
    - navigation.sections
    - search.highlight
    - toc.follow
extra:
  status:
    new: Recently added
extra_css:
  - stylesheets/site.css
extra_javascript:
  - javascripts/collapse_toc_sections.js
validation:
  anchors: warn
markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
nav:
  - Home: index.md
  - What's New: whats-new.md
  - CoE5SE Commands:
      - Overview: commands/index.md
      - Spells:
          - New Spells: commands/spells.md
          - Spell Modifiers: commands/spell-modifiers.md
          - Army Healing: commands/army-healing.md
          - Spell Paths: commands/spell-paths.md
      - Monsters:
          - Monster Traits: commands/monster-traits.md
          - Immunities: commands/immunities.md
          - Commander Names: commands/commander-names.md
          - Monster and Ritual Names: commands/monster-names.md
      - Recruitment Bonuses: commands/recruitment.md
      - Ritual Effects: commands/ritual-effects.md
      - Weapon Traits: commands/weapon-traits.md
      - Exploding Variables and Dice: commands/noexplode.md
      - Corpses: commands/corpses.md
      - Planes: commands/planes.md
      - Factions: commands/factions.md
      - Events: commands/events.md
      - Mod Setup:
          - Mod Settings: commands/mod-settings.md
          - Mod Loading: commands/mod-loading.md
          - Other Commands: commands/other-commands.md
      - Limits: commands/limits.md
  - Lua:
      - Overview: lua/index.md
      - LAN Games: lua/lan-games.md

hooks:
  - hooks/tooltips.py
  - hooks/new_labels.py
  - hooks/command_toc.py
  - hooks/command_versions.py
