site_name: CoE5SE
repo_url: https://github.com/musical-pianist/coe5se-docs
edit_uri: edit/main/docs/
docs_dir: docs
theme:
  name: material
  features:
    - content.action.edit
    - navigation.indexes
    - search.highlight
markdown_extensions:
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
nav:
  - Home: index.md
  - Small Modding Tidbits: small-modding-tidbits.md
