# Vale (https://vale.sh) checks the site's prose: `vale sync` once, then `vale docs`.
# Microsoft and write-good flag wordy phrasing; CoE5SE holds this site's own rules.
StylesPath = styles
MinAlertLevel = suggestion
Packages = Microsoft, write-good

[docs/**/*.md]
BasedOnStyles = Microsoft, write-good, CoE5SE

# Command names and file names read as misspellings.
Vale.Spelling = NO
# The site uses title case headings and no contractions in reference text.
Microsoft.Headings = NO
Microsoft.Contractions = NO
# Reference text addresses the modder.
Microsoft.We = NO
# "e.g." style and ranges are written out already; these fire on numbers in commands.
Microsoft.Units = NO
# write-good's E-Prime flags every "is", which reference text needs.
write-good.E-Prime = NO
# A quoted name is the exact text a modder types; punctuation stays outside it.
Microsoft.Quotes = NO
# "percent chance" is the game's own wording for a command's argument.
Microsoft.Percentages = NO
# These fire on lists the site writes correctly, and on DLL and Lua, which modders know.
Microsoft.OxfordComma = NO
Microsoft.Acronyms = NO
Microsoft.Vocab = NO
